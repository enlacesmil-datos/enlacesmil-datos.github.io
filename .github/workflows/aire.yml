# Polen y calidad del aire para la app (Copernicus CAMS, previsión europea).
# Va en el repositorio enlacesmil-datos.github.io como .github/workflows/aire.yml
# Necesita el secreto ADS_API_KEY (la clave de la web de Copernicus ADS).
name: Polen y aire (Copernicus)

on:
  schedule:
    - cron: '15 9 * * *'   # cada día a las 9:15 UTC (10:15 en invierno, 11:15 en verano)
  workflow_dispatch:        # y a mano, con «Run workflow»

permissions:
  contents: write

concurrency:
  group: aire
  cancel-in-progress: false

jobs:
  aire:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar
        run: pip install "cdsapi>=0.7.4" netCDF4 numpy

      - name: Descargar y preparar aire.json
        env:
          CDSAPI_URL: https://ads.atmosphere.copernicus.eu/api
          CDSAPI_KEY: ${{ secrets.ADS_API_KEY }}
        run: |
          cat > /tmp/aire.py <<'PY'
          import cdsapi, datetime, glob, json, os, shutil, zipfile
          import numpy as np
          from netCDF4 import Dataset

          # España (península, Baleares, Ceuta y Melilla). Canarias queda fuera del dominio europeo de CAMS.
          N, S, O, E = 44.0, 35.0, -9.6, 4.6
          PASO = 0.2
          VARIABLES = ["particulate_matter_2.5um", "particulate_matter_10um", "nitrogen_dioxide", "ozone", "sulphur_dioxide",
                       "grass_pollen", "olive_pollen", "birch_pollen", "alder_pollen", "mugwort_pollen", "ragweed_pollen"]
          # Nombre en el NetCDF -> clave propia
          CLAVES = {"pm2p5": "pm25", "pm10": "pm10", "no2": "no2", "o3": "o3", "so2": "so2",
                    "gpg": "g", "opg": "o", "bpg": "b", "apg": "a", "mpg": "m", "rwpg": "r"}
          DIAS = 3

          def descarga(fecha, desde):
              horas = [str(h) for h in range(desde, desde + 24 * DIAS)]
              d = fecha.isoformat()
              cdsapi.Client().retrieve("cams-europe-air-quality-forecasts", {
                  "variable": VARIABLES, "model": ["ensemble"], "level": ["0"], "date": [d + "/" + d],
                  "type": ["forecast"], "time": ["00:00"], "leadtime_hour": horas,
                  "data_format": "netcdf_zip", "area": [N, O, S, E]}, "/tmp/cams.dat")

          hoy = datetime.datetime.now(datetime.timezone.utc).date()
          try:
              descarga(hoy, 0); base = hoy
          except Exception as e:
              print("La de hoy aún no está (", e, "); uso la de ayer")
              descarga(hoy - datetime.timedelta(days=1), 24); base = hoy - datetime.timedelta(days=1)

          shutil.rmtree("/tmp/nc", ignore_errors=True); os.makedirs("/tmp/nc")
          if zipfile.is_zipfile("/tmp/cams.dat"):
              zipfile.ZipFile("/tmp/cams.dat").extractall("/tmp/nc")
          else:
              shutil.copy("/tmp/cams.dat", "/tmp/nc/cams.nc")

          datos, lats, lons = {}, None, None
          for f in glob.glob("/tmp/nc/**/*.nc", recursive=True):
              ds = Dataset(f)
              la = np.array(ds.variables["latitude"][:], dtype=float); lo = np.array(ds.variables["longitude"][:], dtype=float)
              lo = np.where(lo > 180, lo - 360, lo)
              for nombre, v in ds.variables.items():
                  clave = CLAVES.get(nombre.lower().replace("_conc", ""))
                  if clave is None or v.ndim < 3: continue
                  a = np.ma.filled(np.ma.array(v[:], dtype=float), np.nan)
                  a = a.reshape((-1, a.shape[-2], a.shape[-1]))   # (horas, lat, lon), sin la dimensión de nivel
                  datos[clave] = a; lats, lons = la, lo
          faltan = [c for c in CLAVES.values() if c not in datos]
          print("Variables:", sorted(datos), "faltan:", faltan)
          if not datos or "o3" not in datos: raise SystemExit("Sin datos útiles")

          # Rejilla propia de 0,2 grados (de norte a sur y de oeste a este): el punto de CAMS más cercano a cada uno
          filas = int(round((N - S) / PASO)) + 1; cols = int(round((E - O) / PASO)) + 1
          il = [int(np.abs(lats - (N - i * PASO)).argmin()) for i in range(filas)]
          jl = [int(np.abs(lons - (O + j * PASO)).argmin()) for j in range(cols)]
          def rejilla(a): return a[..., il, :][..., :, jl]

          # Índice europeo de calidad del aire (escala 0-100+ en tramos de 20: buena, aceptable, moderada, mala, muy mala, pésima)
          TRAMOS = {"pm25": [0, 10, 20, 25, 50, 75], "pm10": [0, 20, 40, 50, 100, 150], "no2": [0, 40, 90, 120, 230, 340],
                    "o3": [0, 50, 100, 130, 240, 380], "so2": [0, 100, 200, 350, 500, 750]}
          def indice(c, t):
              x = np.interp(c, t, [0, 20, 40, 60, 80, 100])
              return np.where(c > t[-1], 100 + (c - t[-1]) / (t[-1] - t[-2]) * 20, x)
          def nivel_polen(v):   # 0 nada, 1 bajo, 2 moderado, 3 alto, 4 muy alto (granos/m3)
              return np.digitize(v, [10, 50, 200, 500])

          dias = []
          for n in range(DIAS):
              tramo = slice(n * 24, n * 24 + 24)
              ica = None
              for c, t in TRAMOS.items():
                  if c not in datos: continue
                  h = rejilla(datos[c][tramo])
                  v = np.nanmean(h, axis=0) if c in ("pm25", "pm10") else np.nanmax(h, axis=0)   # partículas: media del día; gases: máximo
                  i = indice(v, t)
                  ica = i if ica is None else np.fmax(ica, i)
              ica = np.where(np.isnan(ica), -1, np.round(ica)).astype(int)
              polen = {}
              for c in "gobamr":
                  if c not in datos: continue
                  v = np.nanmax(rejilla(datos[c][tramo]), axis=0)
                  polen[c] = "".join(str(int(x)) for x in np.where(np.isnan(v), 0, nivel_polen(np.nan_to_num(v))).ravel())
              dias.append({"fecha": (base + datetime.timedelta(days=n)).isoformat(), "ica": ica.ravel().tolist(), "polen": polen})

          dias = [d for d in dias if d["fecha"] >= hoy.isoformat()]
          salida = {"generado": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%MZ"), "base": base.isoformat(),
                    "norte": N, "oeste": O, "paso": PASO, "filas": filas, "cols": cols, "dias": dias,
                    "fuente": "Contains modified Copernicus Atmosphere Monitoring Service information " + str(hoy.year)}
          with open("aire.json", "w") as f: json.dump(salida, f, separators=(",", ":"))
          print("aire.json:", os.path.getsize("aire.json"), "bytes,", len(dias), "días")
          PY
          python /tmp/aire.py

      - name: Publicar aire.json
        run: |
          git config user.name "enlacesmil-datos"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aire.json
          git diff --cached --quiet && exit 0
          git commit -m "Polen y aire $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase --quiet && git push && exit 0; sleep 20; done
          exit 1
